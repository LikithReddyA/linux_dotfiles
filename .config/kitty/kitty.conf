# ─── Kitty Config with Working Ligatures ─────────────────────────────────

# Background
background_opacity 0.7
dynamic_background_opacity yes

# Theme
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Window padding (Order: left right top bottom)
window_padding_width 8 8 10 10

# ─── Base Font (Main Text) ────────────────────────────────────────────────
# Use a ligature-supporting font
font_family FiraCode Nerd Font
bold_font FiraCode Nerd Font Bold
italic_font FiraCode Nerd Font Italic
bold_italic_font FiraCode Nerd Font Bold Italic
font_size 14.0

# Enable font ligatures
enable_ligatures yes
disable_ligatures cursor

# Optional: increase rendering performance for ligatures-heavy code
# interpolation_method best
