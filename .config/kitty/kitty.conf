# ─── Kitty Config with Working Ligatures ─────────────────────────────────

# Background
background_opacity 0.85
dynamic_background_opacity yes

# Theme
# BEGIN_KITTY_THEME
# Catppuccin-Mocha
include current-theme.conf
# END_KITTY_THEME

# Window padding (Order: left right top bottom)
window_padding_width 8 8 10 10

# ─── Base Font (Main Text) ────────────────────────────────────────────────
# Use a ligature-supporting font
# ─── Kitty Font Configuration ──────────────────────────────────────────────

# Base font
font_family SauceCodePro Nerd Font
bold_font SauceCodePro Nerd Font
italic_font SauceCodePro Nerd Font
bold_italic_font SauceCodePro Nerd Font
font_size 14.0

# Fallback fonts for emojis
fallback_font Noto Color Emoji, JoyPixels

# Emoji width fix
emoji_ambiguity_width 2

# Enable font ligatures
enable_ligatures yes
disable_ligatures cursor

# Optional: increase rendering performance for ligatures-heavy code
# interpolation_method best
