set -g default-terminal "tmux-256color"
set -as terminal-overrides ",*:Tc"

set -g prefix C-space
unbind C-b
bind-key C-space send-prefix

bind-key -n C-_ send-keys C-_

bind c new-window -c "#{pane_current_path}"

unbind %
bind | split-window -h -c "#{pane_current_path}"

unbind '"'
bind - split-window -v -c "#{pane_current_path}"

unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "󰑓 Config reloaded"

bind -r j resize-pane -D 5
bind -r k resize-pane -U 5
bind -r l resize-pane -R 5
bind -r h resize-pane -L 5
bind -r m resize-pane -Z

set -g mouse on

set -g history-limit 50000

set-window-option -g mode-keys vi

bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send -X copy-selection

unbind -T copy-mode-vi MouseDragEnd1Pane

set-option -g status-position top

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
# set -g @plugin 'tmux-plugins/tmux-yank'

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_enable_status "on"
set -g @catppuccin_window_status_style "rounded"

set -g status-left-length 100
set -g status-right-length 100
set -g status-left "#{E:@catppuccin_status_session}"
# set -g status-right "#{E:@catppuccin_status_application}"
set -gF  status-right "#{@catppuccin_status_directory}"
# set -agF status-right "#{E:@catppuccin_status_date_time}"

# set -g @resurrect-capture-pane-contents 'on'
# set -g @continuum-restore 'on'
# set -g @continuum-save-interval '1'

# set-option -sg escape-time 10
# set-option -g focus-events on

# bind w display-popup -E -w 30% -h 50% ~/.config/tmux/scripts/tmux-menu.sh

# bind T display-popup -E -w 80% -h 80% ~/.config/tmux/scripts/tmux-scratch.sh

# bind g display-popup -d "#{pane_current_path}" -E -w 80% -h 80% -E lazygit

run '~/.config/tmux/plugins/tpm/tpm'
